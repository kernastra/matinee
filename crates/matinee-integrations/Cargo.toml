[package]
name = "matinee-integrations"
description = "Radarr and Sonarr client. Credentials, calendars, and home selection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures = "0.3"
log = "0.4"
matinee-secrets = { path = "../matinee-secrets" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"

[dev-dependencies]
# Drives the real HTTP client in the destination tests. reqwest already
# brings Tokio; this only adds its runtime to test builds.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
