[package]
name = "matinee-jellyfin"
description = "Jellyfin client. HTTP, auth, and conversion into matinee-core types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
log = "0.4"
matinee-core.workspace = true
matinee-secrets.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "charset", "http2", "system-proxy", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"

[lints]
workspace = true
