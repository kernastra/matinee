[package]
name = "atelier-ui"
description = "Reusable design system and component layer over GPUI (working name: Atelier)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
gpui.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
unicode-segmentation = "1.13"

[features]
# Headless GPUI test platform for crates that test their own views on
# Atelier without depending on GPUI directly.
test-support = ["gpui/test-support"]

[dev-dependencies]
# Headless TestPlatform for component behavior tests (no GPU or display).
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
