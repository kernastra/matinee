[package]
name = "matinee-player"
description = "Matinee's native playback engine. libmpv is loaded at runtime and stays behind this API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libloading = "0.8"

# The workspace forbids `unsafe_code`. This crate is the one exception: the
# libmpv client API is C. Cargo cannot inherit workspace lints and override a
# single one, so the clippy set is repeated here and `unsafe_code` is allowed.
# Every `unsafe` block lives in `engine/ffi.rs`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
