[package]
name = "matinee"
version = "0.4.0"
description = "A cinematic desktop client for Jellyfin"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "matinee_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["devtools", "macos-private-api", "tray-icon"] }
tokio = { version = "1", features = ["process", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
