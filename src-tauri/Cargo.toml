[package]
name = "matinee"
version = "0.5.6"
description = "A cinematic desktop client for Jellyfin"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "matinee_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
matinee-integrations = { path = "../crates/matinee-integrations" }
matinee-secrets = { path = "../crates/matinee-secrets" }
matinee-studio = { path = "../crates/matinee-studio" }
serde_json = "1"
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
