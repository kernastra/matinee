[package]
name = "matinee"
version = "0.2.0"
description = "A cinematic desktop client for Jellyfin"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "matinee_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools", "macos-private-api"] }

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
