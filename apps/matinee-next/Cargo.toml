[package]
name = "matinee-next"
description = "Native Matinee application. Owns the service runtime, the Jellyfin session, Login, and the Player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "matinee_next"
path = "src/lib.rs"

[[bin]]
name = "matinee-next"
path = "src/main.rs"

[dependencies]
atelier-app.workspace = true
atelier-ui.workspace = true
futures = "0.3"
matinee-core.workspace = true
matinee-jellyfin.workspace = true
matinee-player.workspace = true
matinee-secrets.workspace = true
matinee-ui.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
url = "2"
zeroize = "1"

[dev-dependencies]
atelier-ui = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
