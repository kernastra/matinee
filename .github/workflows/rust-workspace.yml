name: Rust workspace

# Validates the Matinee Next Rust + GPUI workspace (crates/, apps/) and
# compiles the shipping Tauri adapters in src-tauri/. Linux also runs the
# adapter tests. macOS and Windows compile src-tauri; they do not launch it.
# See docs/architecture/overview.md.

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - apps/**
      - scripts/check-architecture.sh
      - src-tauri/**
      - .github/workflows/rust-workspace.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - apps/**
      - scripts/check-architecture.sh
      - src-tauri/**
      - .github/workflows/rust-workspace.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with `rust-version` in Cargo.toml and docs/architecture/ui-framework.md.
  RUST_TOOLCHAIN: "1.90.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint, boundaries, tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      # The all-targets debug tree, plus the Jellyfin client's HTTP
      # dependencies, fills the Linux runner if target/ is restored and
      # debug info is kept. Dependencies stay cached. Debug info does not.
      # libmpv integration tests still run in this job.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev \
            libmpv2 ffmpeg
      - name: Architecture boundaries
        run: scripts/check-architecture.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Do not restore a target/ cache on Linux. A previous all-targets debug
      # tree is large enough to fill the runner before this job links anything.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: ${{ runner.os != 'Linux' && 'true' || 'false' }}
      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev
      # macOS and Windows are the only jobs that compile and test those targets.
      - name: Build workspace
        if: runner.os != 'Linux'
        run: cargo build --workspace --all-targets --locked
      # Linux libmpv integration tests run in the lint job. Repeating
      # `--all-targets` here keeps another copy of every debug GPUI binary
      # (hundreds of MB each) and exhausts the runner disk. Link the workspace
      # bins and libraries only.
      - name: Build workspace
        if: runner.os == 'Linux'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --workspace --locked
      - name: Test (platform-specific code paths)
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

  shipping:
    name: Shipping Tauri adapters (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
            test: true
          - os: macos-15
            name: macOS
            test: false
          - os: windows-2022
            name: Windows
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install Tauri and credential libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Check shipping adapters
        working-directory: src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo check --locked
      - name: Test shipping adapters
        if: matrix.test
        working-directory: src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked
