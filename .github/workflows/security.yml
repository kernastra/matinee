name: Security audit

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  web:
    name: Web dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm audit

  rust:
    name: Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
